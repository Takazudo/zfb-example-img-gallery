name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec zfb --version
      # `zfb build` does not type-check TS/TSX, so this runs first and fails fast.
      - run: pnpm typecheck
      # Inner-loop projects only. The final integration sub-task adds the smoke lane here.
      - run: pnpm test
      - run: pnpm build

      # Idempotent: wrangler tracks applied migrations in `d1_migrations`.
      - name: Apply D1 migrations (remote)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec wrangler d1 migrations apply img-gallery-preview --env preview --remote
          else
            pnpm exec wrangler d1 migrations apply img-gallery --remote
          fi

      # `--env=""` explicitly selects top-level (production) config.
      - name: Deploy production Worker
        if: github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy --env=""

      - name: Upload PR preview version
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          pnpm exec wrangler versions upload --env preview \
            --preview-alias "pr-${{ github.event.pull_request.number }}"
