name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Detect Cloudflare deployment readiness
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          configured=true
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            configured=false
          fi
          uuid='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          if [ "$(grep -Ec "^database_id = \"${uuid}\"$" wrangler.toml || true)" -ne 2 ]; then
            configured=false
          fi
          echo "configured=${configured}" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec zfb --version
      # `zfb build` does not type-check TS/TSX, so this runs first and fails fast.
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit / SSR / handler tests
        run: pnpm exec vitest run --project unit --project ssr --project handlers
      - name: Build
        run: pnpm build
      # The Workers pool reads wrangler.toml's main (dist/_worker.js), so the
      # integration project must run after the build on a clean checkout.
      - name: Integration tests
        run: pnpm exec vitest run --project integration
      - name: Assert SSR invariants
        run: node scripts/assert-ssr-invariants.mjs
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E smoke
        env:
          CI: "1"
        run: pnpm exec playwright test --grep @smoke
      - name: Upload e2e artefacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artefacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Report deferred Cloudflare deployment
        if: steps.cloudflare.outputs.configured != 'true'
        run: echo "::notice::Cloudflare deployment deferred until bootstrap IDs and repository secrets are configured; all local CI gates passed."

      # Idempotent: wrangler tracks applied migrations in `d1_migrations`.
      - name: Apply D1 migrations (remote)
        if: steps.cloudflare.outputs.configured == 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec wrangler d1 migrations apply img-gallery-preview --env preview --remote
          else
            pnpm exec wrangler d1 migrations apply img-gallery --remote
          fi

      # `--env=""` explicitly selects top-level (production) config.
      - name: Deploy production Worker
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name != 'pull_request'
        run: pnpm exec wrangler deploy --env=""

      # A Worker script must exist before its workers.dev settings can be
      # changed. On a fresh account, create one unaliased bootstrap version.
      - name: Ensure PR preview Worker exists
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if pnpm exec wrangler versions list --env preview --json > /dev/null; then
            exit 0
          fi
          echo "::notice::Creating the initial preview Worker version before enabling preview URLs"
          pnpm exec wrangler versions upload --env preview

      # `versions upload` deliberately leaves trigger configuration untouched.
      # Apply workers_dev/preview_urls before creating the aliased version so
      # Cloudflare marks that version as previewable at upload time.
      - name: Apply PR preview triggers
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name == 'pull_request'
        run: pnpm exec wrangler triggers deploy --env preview

      - name: Upload PR preview version
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name == 'pull_request'
        run: |
          pnpm exec wrangler versions upload --env preview \
            --preview-alias "pr-${{ github.event.pull_request.number }}"

      # Preview URLs follow <alias>-<worker>.<account-subdomain>.workers.dev.
      - name: Resolve PR preview URL
        id: workers-dev
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          subdomain_response=$(curl --silent --show-error --fail-with-body \
            --request GET "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/workers/subdomain" \
            --header "Authorization: Bearer ${API_TOKEN}")
          subdomain=$(jq -r '.result.subdomain // empty' <<<"$subdomain_response")
          if [ -z "$subdomain" ]; then
            echo "::error::Cloudflare did not return the workers.dev account subdomain"
            exit 1
          fi
          echo "preview_url=https://pr-${PR_NUMBER}-zfb-example-img-gallery-preview.${subdomain}.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Smoke-test PR preview
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ steps.workers-dev.outputs.preview_url }}
        run: |
          set -euo pipefail
          preview_body=$(mktemp)
          trap 'rm -f "$preview_body"' EXIT

          for attempt in 1 2 3 4; do
            if curl --silent --show-error --fail-with-body \
              --connect-timeout 10 --max-time 30 \
              --output "$preview_body" "${PREVIEW_URL}/"; then
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::PR preview did not become reachable at ${PREVIEW_URL}/"
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

          grep --fixed-strings --quiet 'Stillframe' "$preview_body"
          grep --fixed-strings --quiet 'href="/assets/app.css"' "$preview_body"
          curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null "${PREVIEW_URL}/assets/app.css"

      - name: Comment PR preview URL
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@d746ffe35508b1917358783b479e04febd2b8f71 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.workers-dev.outputs.preview_url }}
        with:
          script: |
            const marker = "<!-- zfb-example-img-gallery-preview -->";
            const body = `${marker}\nPreview deployment: [open the PR environment](${process.env.PREVIEW_URL})`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Smoke-test the custom domain
        if: steps.cloudflare.outputs.configured == 'true' && github.event_name != 'pull_request'
        env:
          SMOKE_REQUIRE_LIVE: "1"
        run: node scripts/smoke.mjs
